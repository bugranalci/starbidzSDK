name: SDK Adapters CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'adapters/**'
      - '.github/workflows/adapters.yml'
      - 'Starbidz.podspec'
      - 'jitpack.yml'
    tags:
      - '*'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/**'

jobs:
  # ==================== Android ====================
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android SDK
        working-directory: ./adapters/android
        run: ./gradlew :starbidz:assembleRelease -x test

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk
          path: adapters/android/starbidz/build/outputs/aar/

  # ==================== iOS ====================
  ios-build:
    name: iOS Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Validate Podspec
        run: pod lib lint Starbidz.podspec --allow-warnings --skip-tests
        continue-on-error: true

      - name: Check Swift Syntax
        run: |
          swiftc -parse adapters/ios/Starbidz/Sources/*.swift || true

  # ==================== Release ====================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android-build, ios-build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-sdk
          path: ./release/android

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            release/android/**/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
