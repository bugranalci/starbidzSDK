# JitPack build configuration for Starbidz SDK
# https://github.com/bugranalci/starbidzSDK

jdk:
  - openjdk17

before_install:
  - chmod +x gradlew
  - export ANDROID_HOME=$HOME/android-sdk
  - export PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools

install:
  - ./gradlew :starbidz:assembleRelease :starbidz:publishToMavenLocal -x test
