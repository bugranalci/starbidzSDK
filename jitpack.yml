# JitPack build configuration for Starbidz SDK
# https://github.com/bugranalci/starbidzSDK

jdk:
  - openjdk17

before_install:
  - chmod +x adapters/android/gradlew

install:
  - cd adapters/android && ./gradlew :starbidz:assembleRelease :starbidz:publishToMavenLocal :starbidz-max:assembleRelease :starbidz-max:publishToMavenLocal -x test
